version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: bookflow-database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ifsp
      MYSQL_DATABASE: bookflow
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rede-privada

  backend:
    build: ./backend
    container_name: bookflow-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/bookflow?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ifsp
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - database
    networks:
      - rede-privada
      - rede-publica
  
  frontend:
    build: ./frontend
    container_name: bookflow-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rede-publica

networks:
  rede-privada:
    driver: bridge
  rede-publica:
    driver: bridge

volumes:
  db_data:
