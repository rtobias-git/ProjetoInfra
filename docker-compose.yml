version: "3.8"

networks:
  net-app:
    driver: bridge
  net-db:
    driver: bridge

services:
  app:
    build: ./frontend
    container_name: app
    restart: always
    depends_on:
      - back-end
    ports:
      - "3000:80"
    networks:
      - net-app

  back-end:
    container_name: back-end
    build: ./backend
    restart: always
    ports:
      - "8080:8080"
    networks:
      - net-app
      - net-db
    env_file:
      - "variables.env"
    depends_on:
      - db

  db:
    restart: always
    container_name: mysql
    image: mysql:8.0
    ports:
      - "3307:3306"
    networks:
      - net-db
    env_file:
      - "variables.env"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
