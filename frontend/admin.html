<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFlow - Cadastro de Livros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="nav-left">
        <a href="index.html" class="logo">BookFlow</a>
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html" class="nav-link">Livros</a>
        <a href="admin.html" class="nav-link active">Admin</a>
    </div>
    <div class="nav-right">
        <span class="user-email">bibliotecario@email.com (ADMIN)</span>
        <button class="btn-sair" onclick="logout()">Sair</button>
    </div>
</header>

<main class="container">
    <div class="card">
        <div class="card-header">
            <h2>Cadastro de Livros</h2>
        </div>

        <form class="form-grid" onsubmit="cadastrarLivro(event)">
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" placeholder="Digite o título do livro" required>

            <label for="autor">Autor:</label>
            <input type="text" id="autor" placeholder="Digite o autor" required>

            <label for="isbn">ISBN:</label>
            <input type="text" id="isbn" placeholder="Digite o código ISBN" required>

            <label for="categoria">Categoria:</label>
            <select id="categoria" required>
                <option value="">Selecione uma categoria</option>
            </select>

            <label for="situacao">Situação:</label>
            <select id="situacao">
                <option value="true" selected>Disponível</option>
                <option value="false">Emprestado</option>
            </select>

            <div class="form-actions">
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </div>
        </form>
    </div>
</main>

<script src="app.js"></script>
</body>
</html>
