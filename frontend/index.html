<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="nav-left">
        <span class="logo">BookFlow</span>
        <a href="#" class="nav-link">Home</a>
        <a href="#" class="nav-link active">Livros</a>
        <a href="#" class="nav-link">Admin</a>
    </div>
    <div class="nav-right">
        <span class="user-email">bibliotecario@email.com (ADMIN)</span>
        <button class="btn-sair">Sair</button>
    </div>
</header>

<main class="container">
    <div class="card">
        <div class="card-header">
            <h2>Catálogo de Livros</h2>
            <span class="total-info" id="totalInfo">5 livros cadastrados</span>
        </div>

        <div class="filter-section">
            <label for="filtroCategoria">Filtrar por Categoria:</label>
            <select id="filtroCategoria">
                <option value="">Todas as Categorias</option>
            </select>
            <button class="btn-filtrar" onclick="filtrarLivros()">Filtrar</button>
        </div>

        <table class="tabela-livros">
            <thead>
                <tr>
                    <th>TITLE</th>
                    <th>AUTHOR</th>
                    <th>ISBN</th>
                    <th>CATEGORIA</th>
                    <th>DISPONIBILIDADE</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                <tr>
                    <td colspan="5" style="text-align: center; padding: 20px;">Carregando...</td>
                </tr>
            </tbody>
        </table>

        <div class="pagination">
            <span id="paginacaoTexto">1-5 de 5 registros</span>
            <div class="paginacao-botoes">
                <button class="page-btn">&laquo;</button>
                <button class="page-btn">&lt;</button>
                <button class="page-btn active">1</button>
                <button class="page-btn">&gt;</button>
                <button class="page-btn">&raquo;</button>
            </div>
        </div>
    </div>
</main>

<script src="app.js"></script>
</body>
</html>
