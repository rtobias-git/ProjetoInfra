<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFlow - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-wrapper">
    <div class="card login-card">
        <div class="card-header login-header">
            <h2>BookFlow - Entrar</h2>
        </div>

        <form id="loginForm" onsubmit="fazerLogin(event)">
            <div class="login-field">
                <label for="email">E-mail</label>
                <input type="email" id="email" value="bibliotecario@email.com" placeholder="Digite seu e-mail" required>
            </div>

            <div class="login-field">
                <label for="password">Senha</label>
                <input type="password" id="password" value="123456" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-entrar">Entrar</button>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
