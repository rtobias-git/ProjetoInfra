<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <style>
      .bg { fill: #f0f4f8; }
      .navbar { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .logo { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 19px; fill: #1d4ed8; }
      .nav-item { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #64748b; }
      .nav-active { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #1d4ed8; }
      .user-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #dc2626; }
      .btn-sair-bg { fill: #475569; rx: 4; }
      .btn-sair-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #ffffff; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 18px; fill: #1e293b; }
      .total-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .select-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .select-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #1e293b; }
      .btn-filtrar-bg { fill: #1d4ed8; rx: 4; }
      .btn-filtrar-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #ffffff; }
      .th { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #64748b; text-transform: uppercase; }
      .td-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .td-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #334155; }
      .badge-cat-bg { fill: #e0e7ff; rx: 12; }
      .badge-cat-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #4338ca; }
      .badge-disp-bg { fill: #dcfce7; rx: 12; }
      .badge-disp-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #15803d; }
      .badge-emp-bg { fill: #fee2e2; rx: 12; }
      .badge-emp-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #b91c1c; }
      .pag-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .page-btn-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .page-btn-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .page-active-bg { fill: #1d4ed8; stroke: #1d4ed8; stroke-width: 1; rx: 4; }
      .page-active-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #ffffff; font-weight: 600; }
