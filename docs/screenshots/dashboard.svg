  <rect width="1000" height="600" class="bg"/>

  <rect width="1000" height="52" class="navbar"/>
  <text x="40" y="33" class="logo">BookFlow</text>
  <text x="135" y="33" class="nav-item">Home</text>
  <text x="185" y="33" class="nav-active">Livros</text>
  <text x="240" y="33" class="nav-item">Admin</text>

  <text x="700" y="33" class="user-tag">bibliotecario@email.com (ADMIN)</text>
  <rect x="915" y="16" width="50" height="26" class="btn-sair-bg"/>
  <text x="928" y="33" class="btn-sair-txt">Sair</text>

  <g transform="translate(50, 78)">
    <rect width="900" height="480" class="card-bg"/>

    <text x="28" y="40" class="title">Catálogo de Livros</text>
    <text x="765" y="40" class="total-txt">5 livros cadastrados</text>

    <g transform="translate(28, 70)">
      <text x="0" y="20" class="lbl">Filtrar por Categoria:</text>
      <rect x="140" y="0" width="220" height="32" class="select-box"/>
      <text x="154" y="20" class="select-txt">Todas as Categorias</text>
      <polygon points="340,14 345,21 350,14" fill="#64748b"/>

      <rect x="375" y="0" width="75" height="32" class="btn-filtrar-bg"/>
      <text x="394" y="20" class="btn-filtrar-txt">Filtrar</text>
    </g>

    <line x1="28" y1="130" x2="872" y2="130" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="150" class="th">TITLE</text>
    <text x="230" y="150" class="th">AUTHOR</text>
    <text x="460" y="150" class="th">ISBN</text>
    <text x="640" y="150" class="th">CATEGORIA</text>
    <text x="765" y="150" class="th">DISPONIBILIDADE</text>
    <line x1="28" y1="162" x2="872" y2="162" stroke="#e2e8f0" stroke-width="1"/>

    <g transform="translate(28, 172)">
      <text x="4" y="24" class="td-title">Clean Code</text>
      <text x="202" y="24" class="td-txt">Robert C. Martin</text>
      <text x="432" y="24" class="td-txt">978-0132350884</text>
      <rect x="612" y="10" width="85" height="20" class="badge-cat-bg"/>
      <text x="626" y="24" class="badge-cat-txt">Tecnologia</text>
      <rect x="737" y="10" width="80" height="20" class="badge-disp-bg"/>
      <text x="750" y="24" class="badge-disp-txt">Disponível</text>
      <line x1="0" y1="42" x2="844" y2="42" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <g transform="translate(28, 222)">
      <text x="4" y="24" class="td-title">Design Patterns</text>
      <text x="202" y="24" class="td-txt">Erich Gamma, Richard Helm</text>
      <text x="432" y="24" class="td-txt">978-0201633610</text>
      <rect x="612" y="10" width="88" height="20" class="badge-cat-bg"/>
      <text x="623" y="24" class="badge-cat-txt">Engenharia</text>
      <rect x="737" y="10" width="80" height="20" class="badge-disp-bg"/>
      <text x="750" y="24" class="badge-disp-txt">Disponível</text>
      <line x1="0" y1="42" x2="844" y2="42" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <g transform="translate(28, 272)">
      <text x="4" y="24" class="td-title">O Senhor dos Anéis</text>
      <text x="202" y="24" class="td-txt">J.R.R. Tolkien</text>
      <text x="432" y="24" class="td-txt">978-8595084759</text>
      <rect x="612" y="10" width="62" height="20" class="badge-cat-bg"/>
      <text x="625" y="24" class="badge-cat-txt">Ficção</text>
      <rect x="737" y="10" width="80" height="20" class="badge-disp-bg"/>
      <text x="750" y="24" class="badge-disp-txt">Disponível</text>
      <line x1="0" y1="42" x2="844" y2="42" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <g transform="translate(28, 322)">
      <text x="4" y="24" class="td-title">Dom Casmurro</text>
      <text x="202" y="24" class="td-txt">Machado de Assis</text>
      <text x="432" y="24" class="td-txt">978-8572328227</text>
      <rect x="612" y="10" width="78" height="20" class="badge-cat-bg"/>
      <text x="623" y="24" class="badge-cat-txt">Literatura</text>
      <rect x="737" y="10" width="80" height="20" class="badge-disp-bg"/>
      <text x="750" y="24" class="badge-disp-txt">Disponível</text>
      <line x1="0" y1="42" x2="844" y2="42" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <g transform="translate(28, 372)">
      <text x="4" y="24" class="td-title">Arquitetura Limpa</text>
      <text x="202" y="24" class="td-txt">Robert C. Martin</text>
      <text x="432" y="24" class="td-txt">978-8550804606</text>
      <rect x="612" y="10" width="85" height="20" class="badge-cat-bg"/>
      <text x="626" y="24" class="badge-cat-txt">Tecnologia</text>
      <rect x="737" y="10" width="85" height="20" class="badge-emp-bg"/>
      <text x="747" y="24" class="badge-emp-txt">Emprestado</text>
      <line x1="0" y1="42" x2="844" y2="42" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <g transform="translate(370, 436)">
      <text x="0" y="18" class="pag-txt">1-5 de 5 registros</text>
      <rect x="120" y="2" width="24" height="24" class="page-btn-bg"/>
      <text x="126" y="18" class="page-btn-txt">&laquo;</text>
      <rect x="148" y="2" width="24" height="24" class="page-btn-bg"/>
      <text x="156" y="18" class="page-btn-txt">&lt;</text>
      <rect x="176" y="2" width="24" height="24" class="page-active-bg"/>
      <text x="184" y="18" class="page-active-txt">1</text>
      <rect x="204" y="2" width="24" height="24" class="page-btn-bg"/>
      <text x="212" y="18" class="page-btn-txt">&gt;</text>
      <rect x="232" y="2" width="24" height="24" class="page-btn-bg"/>
      <text x="238" y="18" class="page-btn-txt">&raquo;</text>
    </g>
  </g>
</svg>
