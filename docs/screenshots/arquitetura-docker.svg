<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <style>
      .box-front { fill: #e8f4fd; stroke: #0d6efd; stroke-width: 2; rx: 8; }
      .box-back { fill: #f0fbf0; stroke: #198754; stroke-width: 2; rx: 8; }
      .box-db { fill: #fef9e7; stroke: #ffc107; stroke-width: 2; rx: 8; }
      .title { font-family: -apple-system, sans-serif; font-weight: 700; font-size: 16px; fill: #212529; }
      .sub { font-family: -apple-system, sans-serif; font-size: 13px; fill: #6c757d; }
      .port { font-family: SFMono-Regular, monospace; font-size: 12px; font-weight: 600; fill: #495057; }
      .net-label { font-family: -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #0d6efd; }
      .net-db-label { font-family: -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #d63384; }
    </style>
  </defs>

  <rect width="900" height="340" fill="#ffffff" rx="10" stroke="#dee2e6" stroke-width="1"/>

  <text x="30" y="40" style="font-family: -apple-system, sans-serif; font-weight: 700; font-size: 18px; fill: #212529;">Topologia Docker Compose - Redes Isoladas</text>
  <text x="30" y="62" style="font-family: -apple-system, sans-serif; font-size: 13px; fill: #6c757d;">Arquitetura 3-Tier com isolamento estrito de camada de banco de dados</text>

  <g transform="translate(40, 100)">
    <rect width="220" height="180" class="box-front"/>
    <text x="20" y="35" class="title">Frontend</text>
    <text x="20" y="60" class="sub">Nginx 1.25 Alpine</text>
    <text x="20" y="80" class="sub">HTML5 / CSS / Vanilla JS</text>
    <text x="20" y="125" class="port">Porta Externa: 3000</text>
    <text x="20" y="145" class="port">Porta Interna: 80</text>
    <rect x="20" y="155" width="105" height="18" rx="4" fill="#0d6efd"/>
    <text x="26" y="168" style="font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff;">rede-publica</text>
  </g>

  <g transform="translate(340, 100)">
    <rect width="220" height="180" class="box-back"/>
    <text x="20" y="35" class="title">Backend API</text>
    <text x="20" y="60" class="sub">Java 17 / Spring Boot 3</text>
    <text x="20" y="80" class="sub">Spring Data JPA / REST</text>
    <text x="20" y="125" class="port">Porta Externa: 8080</text>
    <text x="20" y="145" class="port">Porta Interna: 8080</text>
    <rect x="20" y="155" width="85" height="18" rx="4" fill="#0d6efd"/>
    <text x="25" y="168" style="font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff;">rede-publica</text>
    <rect x="110" y="155" width="85" height="18" rx="4" fill="#d63384"/>
    <text x="116" y="168" style="font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff;">rede-privada</text>
  </g>

  <g transform="translate(640, 100)">
    <rect width="220" height="180" class="box-db"/>
    <text x="20" y="35" class="title">Banco de Dados</text>
    <text x="20" y="60" class="sub">MySQL 8.0</text>
    <text x="20" y="80" class="sub">Volume Persistente</text>
    <text x="20" y="125" class="port">Porta Externa: 3306</text>
    <text x="20" y="145" class="port">Porta Interna: 3306</text>
    <rect x="20" y="155" width="85" height="18" rx="4" fill="#d63384"/>
    <text x="26" y="168" style="font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff;">rede-privada</text>
  </g>

  <path d="M 260 190 L 340 190" stroke="#0d6efd" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="338,186 346,190 338,194" fill="#0d6efd"/>
  <text x="272" y="180" class="net-label">HTTP / REST</text>

  <path d="M 560 190 L 640 190" stroke="#d63384" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="638,186 646,190 638,194" fill="#d63384"/>
  <text x="580" y="180" class="net-db-label">JDBC</text>
</svg>
