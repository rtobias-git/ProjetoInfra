<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <defs>
    <style>
      .overlay { fill: rgba(0, 0, 0, 0.45); }
      .modal { fill: #ffffff; rx: 8; filter: drop-shadow(0 10px 25px rgba(0,0,0,0.25)); }
      .modal-header { fill: #0d6efd; rx: 8; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #ffffff; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #212529; }
      .input-box { fill: #ffffff; stroke: #ced4da; stroke-width: 1; rx: 4; }
      .input-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #212529; }
      .modal-footer { fill: #f8f9fa; rx: 8; }
      .btn-cancel { fill: #6c757d; rx: 4; }
      .btn-save { fill: #0d6efd; rx: 4; }
      .btn-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1000" height="640" fill="#e9ecef"/>
  <rect width="1000" height="640" class="overlay"/>

  <g transform="translate(250, 70)">
    <rect width="500" height="500" rx="8" class="modal"/>

    <path d="M 0 8 Q 0 0 8 0 L 492 0 Q 500 0 500 8 L 500 50 L 0 50 Z" class="modal-header"/>
    <text x="24" y="32" class="header-title">Cadastrar Novo Livro</text>
    <text x="466" y="32" style="font-family: sans-serif; font-size: 18px; fill: #ffffff; cursor: pointer;">&times;</text>

    <g transform="translate(24, 75)">
      <text x="0" y="0" class="lbl">Titulo do Livro *</text>
      <rect x="0" y="8" width="452" height="36" class="input-box"/>
      <text x="14" y="31" class="input-val">Refatoracao: Aperfeicoando o Design de Codigos</text>
    </g>

    <g transform="translate(24, 150)">
      <text x="0" y="0" class="lbl">Autor *</text>
      <rect x="0" y="8" width="452" height="36" class="input-box"/>
      <text x="14" y="31" class="input-val">Martin Fowler</text>
    </g>

    <g transform="translate(24, 225)">
      <text x="0" y="0" class="lbl">ISBN (13 digitos) *</text>
      <rect x="0" y="8" width="452" height="36" class="input-box"/>
      <text x="14" y="31" class="input-val">9788575227244</text>
    </g>

    <g transform="translate(24, 300)">
      <g>
        <text x="0" y="0" class="lbl">Categoria *</text>
        <rect x="0" y="8" width="260" height="36" class="input-box"/>
        <text x="14" y="31" class="input-val">Tecnologia</text>
        <text x="240" y="31" style="font-size: 10px; fill: #6c757d;">&#9660;</text>
      </g>
      <g transform="translate(280, 0)">
        <text x="0" y="0" class="lbl">Situacao</text>
        <rect x="0" y="8" width="172" height="36" class="input-box"/>
        <text x="14" y="31" class="input-val">Disponivel</text>
        <text x="150" y="31" style="font-size: 10px; fill: #6c757d;">&#9660;</text>
      </g>
    </g>

    <path d="M 0 435 L 500 435 L 500 492 Q 500 500 492 500 L 8 500 Q 0 500 0 492 Z" class="modal-footer"/>
    <line x1="0" y1="435" x2="500" y2="435" stroke="#dee2e6" stroke-width="1"/>

    <rect x="290" y="450" width="85" height="36" class="btn-cancel"/>
    <text x="310" y="473" class="btn-text">Cancelar</text>

    <rect x="385" y="450" width="90" height="36" class="btn-save"/>
    <text x="403" y="473" class="btn-text">Salvar Livro</text>
  </g>
</svg>
